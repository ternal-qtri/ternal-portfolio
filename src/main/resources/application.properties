spring.application.name=Ternal-Portfolio

server.port=${PORT:8080}
# Nhan dien header X-Forwarded-* tu Reverse Proxy (Render/Cloudflare) de tao redirect URI HTTPS cho OAuth2
server.forward-headers-strategy=framework

spring.config.import=optional:file:.env[.properties]

# Cau hinh Database linh hoat (tuong thich ca chay local va deploy Render/Supabase Pooler)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.opfasysvjdfdajdvnebd.supabase.co:${DB_PORT:5432}/${DB_NAME:postgres}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Toi uu HikariCP connection pool (tiet kiem RAM tren Render 512MB & tranh can kiet connection Supabase)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

spring.security.oauth2.client.registration.google.redirect-uri="{baseUrl}/login/oauth2/code/{registrationId}"
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=email,profile

# Resend Email API Configuration (HTTP REST qua port 443 - hoat dong on dinh 100% tren Cloud / Render)
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:Nguyễn Quốc Trí <onboarding@resend.dev>}
resend.reply-to.email=${RESEND_REPLY_TO:${EMAIL_USERNAME:ternal.qtri@gmail.com}}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Async Task Execution (Thread Pool for Mail & Background tasks)
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=async-mail-

# Admin Notification Email
admin.notification.email=${ADMIN_NOTIFICATION_EMAIL:ternal.qtri@gmail.com}