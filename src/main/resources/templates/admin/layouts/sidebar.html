<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar"
    class="w-full md:w-64 bg-[#121214] border-b md:border-b-0 md:border-r border-zinc-800 flex flex-col justify-between flex-shrink-0 z-30">

    <div class="p-5 space-y-6">

        <div class="flex items-center justify-between">
            <a th:href="@{/}" href="/" target="_blank" class="flex items-center gap-2.5 group"
                title="Xem trang Client">
                <span
                    class="w-8 h-8 rounded-lg bg-white flex items-center justify-center font-mono text-sm text-black font-extrabold shadow-sm group-hover:bg-zinc-200 transition-colors">
                    T
                </span>
                <div>
                    <span class="font-bold text-white tracking-tight text-sm">Ternal<span
                            class="text-zinc-500 font-mono text-xs"> - Nguyen Quoc Tri</span></span>
                    <span class="block text-[10px] font-mono text-emerald-400">ADMIN CONSOLE</span>
                </div>
            </a>

            <!-- Mobile Menu Toggle Button -->
            <button id="admin-mobile-toggle"
                class="md:hidden p-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white"
                aria-label="Toggle navigation">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>

        <!-- Navigation Links -->
        <nav id="admin-nav" class="hidden md:flex flex-col gap-1.5 font-mono text-xs">

            <!-- Quản lý loại kỹ năng -->
            <a th:href="@{/admin/skills-categories}" href="/admin/skills-categories"
                class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-zinc-400 hover:text-white hover:bg-zinc-900 border border-transparent hover:border-zinc-800 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
                <span>Loại kỹ năng</span>
            </a>

            <!-- Quản lý kỹ năng -->
            <a th:href="@{/admin/skills}" href="/admin/skills"
                class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-zinc-400 hover:text-white hover:bg-zinc-900 border border-transparent hover:border-zinc-800 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                </svg>
                <span>Quản lý kỹ năng</span>
            </a>

            <!-- Quản lý dự án -->
            <a th:href="@{/admin/projects}" href="/admin/projects"
                class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-zinc-400 hover:text-white hover:bg-zinc-900 border border-transparent hover:border-zinc-800 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                </svg>
                <span>Quản lý dự án</span>
            </a>

            <!-- Quản lý liên hệ -->
            <a th:href="@{/admin/contacts}" href="/admin/contacts"
                class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-zinc-400 hover:text-white hover:bg-zinc-900 border border-transparent hover:border-zinc-800 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                <span>Tin nhắn liên hệ</span>
            </a>

        </nav>
    </div>

    <!-- Bottom User Profile & Đăng xuất -->
    <div class="p-5 border-t border-zinc-800 space-y-3">
        <div class="flex items-center gap-3 p-2 rounded-lg bg-zinc-900/60 border border-zinc-800">
            <div
                class="w-7 h-7 rounded-full bg-white text-black flex items-center justify-center font-bold text-xs font-mono">
                N
            </div>
            <div class="min-w-0 flex-grow">
                <p class="text-xs font-semibold text-white truncate font-sans">Nguyễn Quốc Trí</p>
                <p class="text-[10px] text-zinc-500 font-mono truncate">admin@ternal.dev</p>
            </div>
        </div>

        <a onclick="confirmLogout()" href="javascript:void(0)"
            class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-xs font-mono text-zinc-400 hover:text-white bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            <span>Đăng xuất</span>
        </a>
    </div>

</aside>
</body>
</html>
